# Keeps dtmmods.itch.io up to date: every 30 minutes, the newest full release of each mod listed in ci/itch.json is
# compared with its itch.io page, and uploaded there when it is newer (the zip as it is, under its own name, with the
# release version). Pre-releases (test builds) never go to itch.
# A mod is skipped until its itch.io page exists: create it once on itch.io under the project name in ci/itch.json.
# Needs the secret BUTLER_API_KEY in this repository (an itch.io API key of the dtmmods account: itch.io > Settings >
# API keys; gh secret set BUTLER_API_KEY -R DTM-Mods/.github). Without it the run does nothing. Run it by hand (Actions > itch.io sync > Run workflow) for one mod or as
# a dry run.
name: itch.io sync

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Only this repository (e.g. FS25_Searchables); empty = every mod in ci/itch.json"
        type: string
        default: ""
      dry_run:
        description: "Only check and report, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: itch-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        env:
          BUTLER_VERSION: "15.32.0"
        run: |
          curl -sSfL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "BUTLER=$RUNNER_TEMP/butler/butler" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Upload new releases to itch.io
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          [ -n "$REPO" ] && args+=(--repo "$REPO")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 ci/itch_sync.py "${args[@]}"
