title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        One idea per post, please, so people can vote on each one: the 👍 / ⬆ upvote counts. The most-voted ideas show on [dtmmods.com/roadmap/](https://dtmmods.com/roadmap/) and on the mod's page. Search first: maybe someone had it already.

  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      options:
        - A new mod
        - The website or the server
        - ADAddOn (AutoDrive Add-On)
        - Alpaca PRX500
        - AutoDrive Overdrive
        - Banana Regrow
        - Better Contracts
        - Better Digital Display
        - Box Truck Pro Edition
        - Brandt LandRoller 591A Standalone
        - Courseplay
        - Deployables Anywhere
        - DTM Screenshot Studio
        - DTM Video Studio
        - F1 Toggle
        - Farm Inventory
        - Logistics Hub
        - Mass Tree Exterminator
        - Mod Reveal
        - ModMux
        - Monthly Expense Sheet
        - No AI Collisions Pro Edition
        - Parking Brake Pro Edition
        - Pig Barn With Feeding Robot
        - Player Trading+ Pro Edition
        - Pro X Silo Extensions
        - PX150 XL Windrower
        - Recoup Money
        - Roadside Stand
        - Ropa Tiger 6S ProEdition
        - Searchables
        - Server Lag Watch
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and how would you use it in the game?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what would it make easier?
